    <style>
        .div1 {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        table {
            width: 480px;
            height: 480px;
            table-layout: fixed;
            border-collapse: collapse;
        }
        table td {
            width: 120px;
            height: 120px;
            border: 1px solid black;
            border-radius: 10px;
            overflow: hidden;
            padding: 0;
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        td.revealed .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
        }
        .flip-card-front {
            background-color: white;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
        .flip-card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
