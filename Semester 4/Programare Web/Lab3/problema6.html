<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>Problema 6</title>
  </head>

  <style>
    .div1{
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    table {
      width: 320px;
      height: 320px;
      border-collapse: collapse;
      margin-bottom: 30px;
    }

    th, td {
      width: 80px;
      height: 80px;
      border: 1px solid #000;
      text-align: center;
    }

  </style>

  <body>
    <div class="div1">
      <table>
        <tr>
          <td id="cell-0-0">4</td>
          <td id="cell-0-1">11</td>
          <td id="cell-0-2">2</td>
          <td id="cell-0-3">14</td>
        </tr>
        <tr>
          <td id="cell-1-0">15</td>
          <td id="cell-1-1">5</td>
          <td id="cell-1-2">12</td>
          <td id="cell-1-3">8</td>
        </tr>
        <tr>
          <td id="cell-2-0">1</td>
          <td id="cell-2-1"></td>
          <td id="cell-2-2">10</td>
          <td id="cell-2-3">6</td>
        </tr>
        <tr>
          <td id="cell-3-0">7</td>
          <td id="cell-3-1">13</td>
          <td id="cell-3-2">3</td>
          <td id="cell-3-3">9</td>
        </tr>
      </table>
    </div>
  </body>

  <script>

    const n = 4;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generateRandomMatrix() {
      const values = Array.from({ length: n*(n-1) }, (_, i) => i + 1);
      values.push(null);

      shuffle(values);

      const matrix = [];
      for (let row = 0; row < n; row++) {
        matrix.push(values.slice(row * n, row * n + n));
      }
      return matrix;
    }

    const matrix = generateRandomMatrix();

    let emptyRow, emptyColumn;

    for(let i = 0; i < n; i++)
      for(let j = 0; j < n; j++){
        const elem = document.getElementById(`cell-${i}-${j}`)
        elem.textContent = `${matrix[i][j]}`;
        if (matrix[i][j] === null) {
          emptyRow = i;
          emptyColumn = j;
          elem.textContent = "";
        }
      }


    document.addEventListener('keydown', (event) => {
      switch (event.key) {
        case 'ArrowUp':    move(emptyRow - 1, emptyColumn); break;
        case 'ArrowDown':  move(emptyRow + 1, emptyColumn); break;
        case 'ArrowLeft':  move(emptyRow, emptyColumn - 1); break;
        case 'ArrowRight': move(emptyRow, emptyColumn + 1); break;
      }
    });

    function move(newRow, newCol) {
      if (newRow >= 0 && newRow < n && newCol >= 0 && newCol < n) {

        matrix[emptyRow][emptyColumn] = matrix[newRow][newCol];
        matrix[newRow][newCol] = null;

        const emptyCell = document.getElementById(`cell-${emptyRow}-${emptyColumn}`);
        const targetCell = document.getElementById(`cell-${newRow}-${newCol}`);

        emptyCell.textContent = targetCell.textContent;
        targetCell.textContent = '';

        emptyRow = newRow;
        emptyColumn = newCol;

      }
    }

  </script>
</html>
