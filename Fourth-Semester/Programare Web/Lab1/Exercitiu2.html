<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain</title>
    <style>
        body {
            background-color: #2c3e50;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .rain {
            position: absolute;
            width: 100vw;
            height: 100vh;
        }

        .drop {
            position: absolute;
            width: 200px;
            height: 200px;
            background-image: url('img.png');
            background-size: contain;
            background-repeat: no-repeat;
            animation: rain-fall 1s linear infinite;
            opacity: 0.8;
        }

        @keyframes rain-fall {
            0% {
                transform: translateY(-100vh);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="rain">
        <div class="drop" style="left: 10%; animation-duration: 1.4s;"></div>
        <div class="drop" style="left: 30%; animation-duration: 1.1s;"></div>
        <div class="drop" style="left: 50%; animation-duration: 1s;"></div>
        <div class="drop" style="left: 70%; animation-duration: 1.5s;"></div>
        <div class="drop" style="left: 90%; animation-duration: 2s;"></div>
    </div>
</div>
</body>
</html>
