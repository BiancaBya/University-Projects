<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Problema 4 Orizontal</title>
  <style>
    table {
      border-collapse: collapse;
      margin-bottom: 30px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #000;
    }

    th {
      background-color: #f2f2f2;
      cursor: pointer;
    }

    .highlight {
      background-color: aquamarine;
    }
  </style>
</head>
<body>

<table class="sortable-table">
  <thead>
  <tr>
    <th>Fruct</th>
    <th>Preț</th>
    <th>Cantitate</th>
  </tr>
  </thead>
  <tbody>
  <tr>
    <td>Măr</td>
    <td>3</td>
    <td>10</td>
  </tr>
  <tr>
    <td>Banana</td>
    <td>5</td>
    <td>6</td>
  </tr>
  <tr>
    <td>Kiwi</td>
    <td>2</td>
    <td>12</td>
  </tr>
  </tbody>
</table>

<table class="sortable-table">
  <thead>
  <tr>
    <th>Student</th>
    <th>Nota</th>
    <th>Prezente</th>
  </tr>
  </thead>
  <tbody>
  <tr>
    <td>Andrei</td>
    <td>7</td>
    <td>12</td>
  </tr>
  <tr>
    <td>Maria</td>
    <td>10</td>
    <td>15</td>
  </tr>
  <tr>
    <td>Ioana</td>
    <td>8</td>
    <td>14</td>
  </tr>
  </tbody>
</table>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const tables = document.querySelectorAll('.sortable-table');

    tables.forEach(table => {
      const headers = table.querySelectorAll('thead th');
      headers.forEach((header, colIndex) => {
        header.addEventListener('click', () => {
          sortTableByColumn(table, colIndex);
        });
      });
    });

    function sortTableByColumn(table, columnIndex) {
      const tbody = table.querySelector('tbody');
      const rowsArray = Array.from(tbody.rows);

      const isNumeric = rowsArray.every(row => !isNaN(row.cells[columnIndex].textContent.trim()));

      rowsArray.sort((a, b) => {
        const valA = a.cells[columnIndex].textContent.trim();
        const valB = b.cells[columnIndex].textContent.trim();

        const aVal = isNumeric ? parseFloat(valA) : valA.toLowerCase();
        const bVal = isNumeric ? parseFloat(valB) : valB.toLowerCase();

        return aVal > bVal ? 1 : (aVal < bVal ? -1 : 0);
      });

      tbody.innerHTML = '';
      rowsArray.forEach(row => tbody.appendChild(row));

      table.querySelectorAll('th').forEach(th => th.classList.remove('highlight'));
      table.querySelector(`thead th:nth-child(${columnIndex + 1})`).classList.add('highlight');
    }
  });
</script>

</body>
</html>
