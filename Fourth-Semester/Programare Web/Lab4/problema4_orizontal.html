<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Problema 4 Vertical (jQuery)</title>
    <style>
        table {
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #000;
        }
        th {
            background-color: #f2f2f2;
            cursor: pointer;
        }
        .highlight {
            background-color: aquamarine;
        }
    </style>
</head>
<body>

<table class="sortable-table">
    <tr>
        <th>Fruct</th>
        <td>Măr</td>
        <td>Banana</td>
        <td>Kiwi</td>
    </tr>
    <tr>
        <th>Preț</th>
        <td>3</td>
        <td>5</td>
        <td>2</td>
    </tr>
    <tr>
        <th>Cantitate</th>
        <td>10</td>
        <td>6</td>
        <td>12</td>
    </tr>
</table>

<table class="sortable-table">
    <tr>
        <th>Student</th>
        <td>Andrei</td>
        <td>Maria</td>
        <td>Ioana</td>
    </tr>
    <tr>
        <th>Notă</th>
        <td>7</td>
        <td>10</td>
        <td>8</td>
    </tr>
    <tr>
        <th>Prezențe</th>
        <td>12</td>
        <td>15</td>
        <td>14</td>
    </tr>
</table>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/problema4_orizontal.js"></script>
</body>
</html>
