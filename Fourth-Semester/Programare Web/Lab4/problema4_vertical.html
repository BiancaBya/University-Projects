<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Problema 4 Orizontal</title>
    <style>
        table {
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #000;
        }
        th {
            background-color: #f2f2f2;
            cursor: pointer;
        }
        .highlight {
            background-color: aquamarine;
        }

</head>

    <tr><td>Banana</td> <td>5</td>  <td>6</td></tr>

</table>

<table class="sortable-table">
    <thead>
    <tr>
        <th>Student</th>
        <th>Notă</th>
        <th>Prezențe</th>
    </tr>
    </thead>
    <tbody>
    <tr><td>Andrei</td><td>7</td>  <td>12</td></tr>
    <tr><td>Maria</td> <td>10</td> <td>15</td></tr>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
