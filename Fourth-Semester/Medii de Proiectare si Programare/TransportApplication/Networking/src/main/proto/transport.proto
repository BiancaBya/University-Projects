syntax = "proto3";

option java_package = "network.grpcprotocol";
option java_outer_classname = "TransportProto";

package grpcprotocol;

// Requests and Responses

enum RequestType {
  UNKNOWN_REQUEST = 0;
  LOGIN = 1;
  GET_ALL_TRIPS_REQ = 2;
  GET_RESERVATIONS_FOR_TRIP_REQ = 3;
  GET_TRIP_BY_DESTINATION_AND_TIME_REQ = 4;
  GET_ALL_RESERVATIONS_REQ = 5;
  FIND_CLIENT_BY_NAME_REQ = 6;
  SAVE_CLIENT_REQ = 7;
  SAVE_RESERVATION_REQ = 8;
  LOGOUT = 9;

}

enum ResponseType {
  UNKNOWN_RESPONSE = 0;
  OK = 1;
  ERROR = 2;
  GET_RESERVATIONS_FOR_TRIP_RESP = 3;
  GET_TRIP_BY_DESTINATION_AND_TIME_RESP = 4;
  GET_ALL_RESERVATIONS_RESP = 5;
  FIND_CLIENT_BY_NAME_RESP = 6;
  SAVE_CLIENT_RESP = 7;
  SAVE_RESERVATION_RESP = 8;
  UPDATE_RESERVATION_ADDED_RESP = 9;
}

// Entities

message Admin {
  int32 id = 1;
  string email = 2;
  string password = 3;
}

message Client {
  int32 id = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string phone = 5;
}

message Trip {
  int32 id = 1;
  string destination = 2;
  string date = 3;
  int32 nrSeats = 4;
}

message Reservation {
  int32 id = 1;
  Client client = 2;
  Trip trip = 3;
  int32 nrReservedSeats= 4;
}

message Seat{
  int32 id = 1;
  int32 seatNumber = 2;
  string clientName = 3;
}



message TripsList {
  repeated Trip trips = 1;
}

message ClientsList {
  repeated Client clients = 1;
}

message ReservationsList {
  repeated Reservation reservations = 1;
}

message TripArray {
  repeated Trip trips = 1;
}

message ReservationArray {
  repeated Reservation reservations = 1;
}


// requests and responses

message TransportRequest {
  RequestType type = 1;

  oneof payload {
    Admin admin = 2;
    Client client = 3;
    Trip trip = 4;
    Reservation reservation = 5;
    TripArray tripArray = 6;
    ReservationArray reservationArray = 7;
  }
}

message TransportResponse {
  ResponseType type = 1;
  string errorMessage = 2;

  Admin admin = 3;
  Client client = 4;
  Trip trip = 5;
  Reservation reservation = 6;
  TripsList trips = 7;
  ReservationsList reservations = 8;
}


// service

service TransportService {
  rpc Connect(stream TransportRequest) returns (stream TransportResponse);
}



