plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.jlink' version '2.25.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

javafx {
    version="21"
    modules = [ 'javafx.controls', 'javafx.fxml'  ]
}

dependencies {

    implementation project(':TransportApplication:Model')
    implementation project(':TransportApplication:Services')
    implementation project(':TransportApplication:Networking')

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'

    implementation 'org.openjfx:javafx-controls:21.0.1'
    implementation 'org.openjfx:javafx-fxml:21.0.1'
}

test {
    useJUnitPlatform()
}

application{
    mainClass='client.StartJsonClient'
}

